; LED-Herz – PlatformIO Projekt
;
; Flashen (Herz-Platine mit XIAO ESP32-C3):
;   pio run -e xiao_esp32c3 -t upload
; Serieller Monitor:
;   pio device monitor
;
; Zum Ausprobieren auf dem Steckbrett gehen auch esp32dev / esp8266 (Pins in src/config.h).

[platformio]
default_envs = xiao_esp32c3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@3.7.8

[env:xiao_esp32c3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
