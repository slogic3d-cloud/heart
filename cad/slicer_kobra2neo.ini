# Anycubic Kobra 2 Neo, 0,4-mm-Düse, "0.20mm Standard" + "Anycubic PLA"
# Werte 1:1 aus den offiziellen Anycubic-Profilen (OrcaSlicer/Anycubic Slicer Next:
# resources/profiles/Anycubic/{machine,process,filament}/...Kobra 2 Neo 0.4 nozzle.json),
# für die PrusaSlicer-Kommandozeile übersetzt. Benutzung:
#   prusa-slicer --export-gcode --load cad/slicer_kobra2neo.ini --center 110,110 cad/out/<teil>.3mf
#
# Drucker
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
gcode_flavor = marlin2
machine_max_acceleration_extruding = 2000
machine_max_acceleration_retracting = 2000
machine_max_acceleration_travel = 20000
machine_max_acceleration_x = 2000
machine_max_acceleration_y = 2000
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 8
machine_max_jerk_x = 10
machine_max_jerk_y = 10
retract_length = 2.5
retract_speed = 100
use_relative_e_distances = 1
before_layer_gcode = G92 E0
# Prozess 0.20mm Standard
layer_height = 0.2
first_layer_height = 0.24
perimeters = 2
top_solid_layers = 3
top_solid_min_thickness = 1
bottom_solid_layers = 3
bottom_solid_min_thickness = 0.6
fill_density = 15%
fill_pattern = grid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
extrusion_width = 0.42
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.42
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.42
top_infill_extrusion_width = 0.42
brim_type = outer_only
brim_width = 5
skirts = 0
perimeter_speed = 100
external_perimeter_speed = 60
infill_speed = 150
solid_infill_speed = 100
top_solid_infill_speed = 60
gap_fill_speed = 100
bridge_speed = 30
travel_speed = 300
first_layer_speed = 50
default_acceleration = 2000
perimeter_acceleration = 1500
external_perimeter_acceleration = 1000
top_solid_infill_acceleration = 1000
first_layer_acceleration = 500
travel_acceleration = 2000
bridge_flow_ratio = 0.9
elefant_foot_compensation = 0.075
support_material = 0
# Filament: Anycubic PLA @Kobra 2 Neo (PLA+ hat dieselbe Dichte 1,24 g/cm³)
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 15.99
extrusion_multiplier = 0.97
filament_max_volumetric_speed = 12
first_layer_temperature = 220
temperature = 210
first_layer_bed_temperature = 60
bed_temperature = 60
