# PrusaSlicer-Einstellungen, mit denen der Filamentverbrauch in KOSTEN.md berechnet wurde
# prusa-slicer --export-gcode --load cad/slicer_pla.ini --center 110,110 cad/out/<teil>.3mf
layer_height = 0.2
